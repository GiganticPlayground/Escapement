<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"
     aria-label="A node starts, recovers, and either takes a free or expired lease to become leader or becomes a follower; a follower promotes when the lease expires, and a leader that is fenced exits, while a graceful stop releases the lease.">
  <style>
    svg { color: #4a5568; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) { svg { color: #b3bcc9; } }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .lead { stroke-width: 2.5; }
    .fill { fill: currentColor; opacity: 0.06; stroke: none; }
    .h { fill: currentColor; font-size: 14px; font-weight: 600; }
    .s { fill: currentColor; font-size: 11.5px; opacity: 0.78; }
    .l { fill: currentColor; font-size: 11.5px; }
    .line { stroke: currentColor; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ar-role" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect class="box" x="30" y="160" width="150" height="66" rx="5"/>
  <text class="h" x="105" y="188" text-anchor="middle">starting</text>
  <text class="s" x="105" y="208" text-anchor="middle">recover first</text>

  <line class="line" x1="180" y1="180" x2="286" y2="120" marker-end="url(#ar-role)"/>
  <text class="l" x="150" y="104">lease free, or</text>
  <text class="l" x="150" y="120">held but expired</text>

  <line class="line" x1="180" y1="206" x2="286" y2="266" marker-end="url(#ar-role)"/>
  <text class="l" x="150" y="250">lease live</text>

  <rect class="fill" x="292" y="60" width="240" height="96" rx="5"/>
  <rect class="box lead" x="292" y="60" width="240" height="96" rx="5"/>
  <text class="h" x="412" y="88" text-anchor="middle">leader</text>
  <text class="s" x="412" y="110" text-anchor="middle">runs the commit loop</text>
  <text class="s" x="412" y="128" text-anchor="middle">renews the lease every TTL / 3</text>
  <text class="s" x="412" y="146" text-anchor="middle">stamps its seq into the lease</text>

  <rect class="fill" x="292" y="240" width="240" height="96" rx="5"/>
  <rect class="box" x="292" y="240" width="240" height="96" rx="5"/>
  <text class="h" x="412" y="268" text-anchor="middle">follower</text>
  <text class="s" x="412" y="290" text-anchor="middle">tails the log, serves reads</text>
  <text class="s" x="412" y="308" text-anchor="middle">forwards mutations</text>
  <text class="s" x="412" y="326" text-anchor="middle">reports healthy on purpose</text>

  <path class="line" d="M 380 240 L 380 156" marker-end="url(#ar-role)"/>
  <text class="l" x="292" y="360">A follower that reports unhealthy is restarted forever</text>
  <text class="l" x="292" y="376">by the orchestrator, so traffic is steered in the app.</text>
  <text class="l" x="392" y="192">lease expired,</text>
  <text class="l" x="392" y="208">won by If-Match</text>

  <line class="line" x1="532" y1="96" x2="640" y2="96" marker-end="url(#ar-role)"/>
  <text class="l" x="538" y="84">fenced at commit</text>

  <rect class="box dash" x="646" y="68" width="224" height="56" rx="5"/>
  <text class="h" x="758" y="92" text-anchor="middle">exit — restart clean</text>
  <text class="s" x="758" y="110" text-anchor="middle">the log decides, not the lease</text>

  <line class="line" x1="532" y1="132" x2="640" y2="176" marker-end="url(#ar-role)"/>
  <text class="l" x="538" y="170">SIGTERM</text>

  <rect class="box" x="646" y="152" width="224" height="66" rx="5"/>
  <text class="h" x="758" y="176" text-anchor="middle">drain, then delete lease</text>
  <text class="s" x="758" y="196" text-anchor="middle">standby promotes in ~400 ms</text>
  <text class="s" x="758" y="212" text-anchor="middle">instead of waiting out the TTL</text>

  <text class="l" x="30" y="304">Safety never depends on this diagram:</text>
  <text class="l" x="30" y="320">two nodes that both believe they lead</text>
  <text class="l" x="30" y="336">are separated by the log's conditional</text>
  <text class="l" x="30" y="352">write, and the loser exits.</text>
</svg>
