<text x="856" y="325" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#f0a868">If-None-Match: *</text>
<text x="836" y="372" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#8ba0b8">A create-only write is three things at once:</text>
