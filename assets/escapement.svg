<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Escapement releases many concurrent claims one batch at a time into an append-only log on S3">
<title>Escapement</title>
<desc>Concurrent claims arrive with no ordering. A single writer — drawn as a clock escape wheel and pallet fork — releases exactly one batch at a time, in order, into an append-only log of objects in S3 written with create-only conditional writes.</desc>
